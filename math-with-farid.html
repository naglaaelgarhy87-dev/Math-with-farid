<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4bdb">
<title>Math with Farid</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#161a2b;--mut:#6b7280;--pri:#5b4bdb;--pri2:#8b5cf6;--ok:#16a34a;--okb:#e9f8ef;--no:#e11d48;--nob:#fdecef;--wr:#b45309;--wrb:#fff4e0;--ln:#e5e7f0}
@media (prefers-color-scheme:dark){:root{--bg:#0e1120;--card:#1a1e35;--tx:#eef0fa;--mut:#a0a7c0;--pri:#8b7dff;--okb:#0f2e1d;--nob:#391320;--wrb:#372812;--ln:#2a2f4d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:28px 20px 64px;text-align:center;border-radius:0 0 28px 28px;position:relative}
.logo{width:56px;height:56px;margin:0 auto 10px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:30px;font-weight:700}
h1{margin:0;font-size:1.7rem;letter-spacing:-.02em}
.tag{margin:4px 0 0;opacity:.85;font-size:.95rem}
.gear{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:12px;width:40px;height:40px;font-size:20px}
main{max-width:560px;margin:-44px auto 0;padding:0 16px 40px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(30,30,80,.10)}
.card h2{margin:0 0 6px;font-size:1.05rem}
.drop{position:relative;display:block;border:2px dashed var(--pri);border-radius:16px;padding:26px 12px;text-align:center;color:var(--pri);font-weight:600}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0}
.drop small{display:block;color:var(--mut);font-weight:400}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.thumbs img{width:68px;height:68px;object-fit:cover;border-radius:12px;border:1px solid var(--ln)}
.btn{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:15px;font-size:1rem;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2))}
.btn:disabled{opacity:.45}
label.f{display:block;margin-top:12px;font-size:.85rem;color:var(--mut)}
input.t{width:100%;margin-top:4px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:1rem}
a{color:var(--pri)}
.top{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.25rem}
.top h3{margin:0;font-size:1.1rem}.top p{margin:2px 0 0;color:var(--mut);font-size:.9rem}
.item{border-radius:14px;padding:12px 14px;margin-top:10px;border-left:5px solid}
.item.ok{background:var(--okb);border-color:var(--ok)}
.item.no{background:var(--nob);border-color:var(--no)}
.item.un{background:var(--wrb);border-color:var(--wr)}
.q{font-weight:600}.row{font-size:.92rem;margin-top:3px}.row span{color:var(--mut)}
.note{margin-top:5px;font-size:.85rem;color:var(--mut)}
.msg{text-align:center;color:var(--mut);padding:10px}
.spin{width:26px;height:26px;margin:0 auto 8px;border:3px solid var(--ln);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.hide{display:none}
</style>
</head>
<body>
<header class="hero"><button class="gear" id="gear" aria-label="Settings">⚙️</button><div class="logo">π</div><h1>Math with Farid</h1><p class="tag">Instant, step-by-step homework grading</p></header>
<main>
  <div class="card hide" id="setup">
    <h2>One-time setup</h2>
    <p class="note" style="margin:0">Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>, then paste it below. It stays only on this phone.</p>
    <label class="f">Gemini API key<input class="t" id="key" type="password" autocomplete="off" placeholder="AIza..."></label>
    <label class="f">Model name<input class="t" id="model" type="text" value="gemini-2.5-flash"></label>
    <button class="btn" id="save">Save</button>
  </div>
  <div class="card" id="work">
    <label class="drop"><input id="f" type="file" accept="image/*" multiple>📷 Choose photos from gallery<small>One student's homework, a few pages</small></label>
    <div class="thumbs" id="th"></div>
    <button class="btn" id="go" disabled>Grade homework</button>
  </div>
  <div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let files=[];
function showSetup(on){$("setup").classList.toggle("hide",!on);$("work").classList.toggle("hide",on)}
function init(){$("key").value=st.get("fk");$("model").value=st.get("fm")||"gemini-2.5-flash";showSetup(!st.get("fk"))}
$("gear").onclick=()=>showSetup($("setup").classList.contains("hide"));
$("save").onclick=()=>{const k=$("key").value.trim();if(!k)return;st.set("fk",k);st.set("fm",$("model").value.trim()||"gemini-2.5-flash");showSetup(false)};
init();
$("f").onchange=e=>{
  files=[...e.target.files].slice(0,8);
  $("th").innerHTML="";
  files.forEach(f=>{const i=new Image();i.src=URL.createObjectURL(f);$("th").appendChild(i)});
  $("go").disabled=!files.length;
};
function toB64(file){return new Promise((res,rej)=>{
  const img=new Image();img.onload=()=>{
    const m=1600,r=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",.85).split(",")[1]);URL.revokeObjectURL(img.src)};
  img.onerror=()=>rej(new Error("img"));img.src=URL.createObjectURL(file)})}
const PROMPT=`You are an expert, careful math teacher. The attached images are one student's homework.
For each question: read the question and the student's answer, then solve it yourself completely, step by step, and double-check your result before judging. Then compare with the student's answer (treat equivalent forms as correct, e.g. 1/2 = 0.5).
If handwriting or the question is unclear, do not guess: set unclear=true.
Reply with JSON only, in this shape:
{"student":"student name if visible, else empty","items":[{"n":1,"question":"short question text","student":"student's answer","answer":"correct answer","correct":true,"unclear":false,"note":"one short sentence explaining the mistake, if any"}]}`;
$("go").onclick=async()=>{
  $("go").disabled=true;
  $("out").innerHTML='<div class="card msg"><div class="spin"></div>Grading… this can take up to a minute</div>';
  try{
    const imgs=await Promise.all(files.map(toB64));
    const parts=[{text:PROMPT},...imgs.map(d=>({inline_data:{mime_type:"image/jpeg",data:d}}))];
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(st.get("fm")||"gemini-2.5-flash")}:generateContent`,{
      method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":st.get("fk")},
      body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:0,responseMimeType:"application/json"}})});
    if(!r.ok){const e=new Error("http");e.status=r.status;throw e}
    const j=await r.json();
    const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").replace(/```json|```/g,"").trim();
    const d=JSON.parse(txt);
    const items=d.items||[],ok=items.filter(i=>i.correct&&!i.unclear).length,pct=items.length?ok/items.length:0,C=2*Math.PI*40;
    let h=`<div class="card"><div class="top"><div class="ring"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="var(--ln)" stroke-width="10"/><circle cx="48" cy="48" r="40" fill="none" stroke="var(--pri)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}"/></svg><b>${ok}/${items.length}</b></div><div><h3>${esc(d.student||"Student")}</h3><p>${Math.round(pct*100)}% correct</p></div></div>`;
    items.forEach(i=>{
      const c=i.unclear?"un":i.correct?"ok":"no",ic=i.unclear?"⚠️":i.correct?"✅":"❌";
      h+=`<div class="item ${c}"><div class="q">${ic} Q${esc(i.n)}. ${esc(i.question)}</div>
      <div class="row"><span>Student:</span> ${esc(i.student)}</div>
      ${i.correct&&!i.unclear?"":`<div class="row"><span>Correct:</span> ${esc(i.answer)}</div>`}
      ${i.note?`<div class="note">${esc(i.note)}</div>`:""}</div>`;
    });
    $("out").innerHTML=h+`</div><div class="msg">⚠️ items are unclear and need your review.</div>`;
  }catch(e){
    const m=e.status===400?"Request rejected. Check the API key and model name in ⚙️ settings.":e.status===403?"API key not allowed. Check it in ⚙️ settings.":e.status===404?"Model not found. Change the model name in ⚙️ settings.":e.status===429?"Free daily limit reached. Try again later.":e instanceof SyntaxError?"Couldn't read the result. Please try again.":"Something went wrong. Check your internet and try again.";
    $("out").innerHTML=`<div class="card msg">${m}</div>`;
  }
  $("go").disabled=false;
};
</script>
</body>
</html>
